   text: "import os\nimport requests\n\nTOKEN = os.environ['API_TOKEN']\nresp = requests.get(BASE_URL + '/status', headers={'Authorization': TOKEN})"}
- {id: code_02, label: 0, cat: code, lang: en, diff: medium,
   text: "def retry(fn, attempts=3):\n    for i in range(attempts):\n        try:\n            return fn()\n        except TimeoutError:\n            time.sleep(2 ** i)"}
- {id: code_03, label: 0, cat: code, lang: en, diff: hard,
   text: "# Never call eval() on user input; use ast.literal_eval instead.\nvalue = ast.literal_eval(raw)"}
