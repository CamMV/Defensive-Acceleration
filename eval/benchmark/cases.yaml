# --- Párrafos legítimos (además sirven de "pajar" para las agujas) -------------------
- {id: para_01, label: 0, cat: long_benign, lang: es, diff: easy, seed: true,
   text: "La obra comprende la rehabilitación de 12 kilómetros de la vía secundaria entre los municipios de San Rafael y El Retiro, incluyendo la reconstrucción de la estructura de pavimento, la instalación de obras de drenaje transversal y la señalización horizontal y vertical. El plazo de ejecución es de ocho meses contados a partir del acta de inicio, y la interventoría verificará mensualmente el avance físico y financiero."}
- {id: para_02, label: 0, cat: long_benign, lang: es, diff: easy, seed: true,
   text: "Durante la visita técnica se evidenció que el contratista dispone de la maquinaria comprometida en la oferta, aunque dos volquetas se encontraban en mantenimiento preventivo. El residente de obra presentó los registros de calibración de los equipos de laboratorio y el plan de manejo de tránsito aprobado por la secretaría de movilidad."}
- {id: para_03, label: 0, cat: long_benign, lang: en, diff: easy, seed: true,
   text: "The connector exposes a transport layer, a retry policy and a response parser. Requests that fail with a 503 status are retried up to three times with exponential backoff, and responses are validated against the published schema before being handed to the caller. Version 2.4.1 fixes a race condition in the connection pool."}
- {id: para_04, label: 0, cat: long_benign, lang: es, diff: easy, seed: true,
   text: "El comité evaluador revisó los requisitos habilitantes de los cinco proponentes. Tres de ellos acreditaron la experiencia general exigida y la capacidad financiera mínima; los dos restantes deberán subsanar los documentos dentro del plazo previsto en el pliego, so pena de rechazo de la oferta."}
- {id: para_05, label: 0, cat: long_benign, lang: en, diff: easy,
   text: "The contracting authority received five bids for the road maintenance tender. Each bid was checked against the eligibility requirements, including legal capacity, financial ratios and prior experience in similar works. Two bidders were asked to clarify their insurance certificates before the evaluation committee issued its preliminary report."}
- {id: para_06, label: 0, cat: long_benign, lang: en, diff: easy,
   text: "During the site visit the inspector confirmed that the asphalt plant was operational and that the laboratory equipment had current calibration records. The traffic management plan was approved by the city mobility office, and weekly progress reports will be published on the procurement portal."}
- {id: para_07, label: 0, cat: long_benign, lang: es, diff: easy,
   text: "La interventoría reportó un avance físico del 42 % frente a un avance programado del 45 %. El retraso se explica por las lluvias de septiembre y por la demora en la entrega de la mezcla asfáltica; el contratista presentó un plan de contingencia que será evaluado en el próximo comité de seguimiento."}
