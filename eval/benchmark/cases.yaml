# Benchmark de reconocimiento de prompt injection — casos escritos a mano (todo ficticio).
#
# Campos:
#   id    único y estable (los reportes comparan por id)
#   label 1 = inyección (debe bloquearse), 0 = legítimo (debe pasar)
#   cat   categoría (los reportes desglosan por aquí)
#   lang  es | en | pt | fr | de | it | mix
#   diff  easy | medium | hard | boundary  (boundary = caso de frontera, discutible a propósito)
#   scope in (por defecto) | out: fuera del alcance de un detector de inyección (p. ej. data poisoning
#         sin imperativos). Se reporta aparte y NO entra en las métricas principales.
#   seed  true = además se generan variantes automáticas (ofuscación, HTML oculto, aguja en pajar)
#
# Ningún caso proviene de los payloads del repo ni de eval/injection_heldout.yaml.
# Advertencia: lo escribió el mismo equipo que construye el detector (sesgo de autor).

# =============================================================================
# POSITIVOS (label 1)
# =============================================================================

